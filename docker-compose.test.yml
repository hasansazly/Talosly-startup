services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talosly
      POSTGRES_PASSWORD: talosly
      POSTGRES_DB: talosly_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talosly -d talosly_test"]
      interval: 1s
      timeout: 3s
      retries: 30
